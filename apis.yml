aid: editsquare

name: Edit Square

description: Edit Square provides a browser‑based motion graphics editor that lets users create, template, and automate animated video at scale.
  Through a simple API, developers can generate renders by sending data to templates, retrieve finished videos, and integrate video creation into
  their applications. The platform offers a free tier for basic editing and paid plans with higher resolution, watermark‑free exports, cloud rendering,
  and team collaboration features. Edit Square aims to democratize video production for marketers, developers, and creators without requiring
  design expertise.

